# OPERATOR: PLEASE VERIFY THIS FILE before you rely on any backtest or live run.
# Check the roll dates against the sources below and against the contract your
# bar source and broker actually serve. Before each quarter, add the next
# contract and move `covers.last`.
#
# Futures roll calendar (Req 4.5), read by `fse.calendars`. A missing file, an
# invalid entry, or a run session outside `covers` stops the run before the
# first Decision_Time with exit code 2 (Req 4.16).
#
# Sources (checked 2026-10-03):
#   CME Group equity index roll dates:
#     https://www.cmegroup.com/trading/equity-index/rolldates.html
#   CME Group E-mini S&P 500 and E-mini Nasdaq-100 contract specs (quarterly
#   March, June, September and December contracts):
#     https://www.cmegroup.com/markets/equities/sp/e-mini-sandp500.contractSpecs.html
#     https://www.cmegroup.com/markets/equities/nasdaq/e-mini-nasdaq-100.contractSpecs.html
#
# Conventions:
#   - Each entry assigns one contract to every session from `first` to `last`,
#     both inclusive. Every bar of a session, including the bars from 18:00 the
#     evening before, comes from that contract (Req 4.5). A session with no
#     entry has no contract; the coverage report records it (Req 4.8).
#   - Roll rule: CME's published equity roll date, the Monday before the third
#     Friday of the expiration month. From that session on, the next quarterly
#     contract is used. The 2026 dates (03-16, 06-15, 09-14, 12-14) match CME's
#     page as quoted by other sites; cmegroup.com refused automated downloads.
#     The same rule is applied to 2023-2025. Some platforms roll on the
#     Thursday eight days before expiration instead; compare with your data.
#   - June 2026: the third Friday (2026-06-19) is the Juneteenth holiday; the
#     roll date is still Monday 2026-06-15.
#   - Contract codes use CME Globex single-digit years: ESZ6 is December 2026.
#   - atlas_symbol and projectx_contract_id are optional and left out, because
#     they were not known with certainty. Add them once resolved with Atlas
#     GET /v1/search and the ProjectX contract search, for example:
#       - {first: 2026-12-14, last: 2026-12-31, contract: ESH7,
#          atlas_symbol: <Atlas ticker>, projectx_contract_id: <ProjectX id>}
#     The Live_Runner compares the ProjectX front-month id with this file at
#     each session start and blocks the instrument on a mismatch (Req 24.11-24.12).
#   - Dates are YYYY-MM-DD.

