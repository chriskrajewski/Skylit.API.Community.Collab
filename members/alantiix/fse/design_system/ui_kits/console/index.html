<!-- @dsCard group="Console" viewport="1440x900" name="fse console" subtitle="Live runner, map, runs, report, experiments, config, cards" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>fse console</title><link rel="stylesheet" href="../../styles.css"><style>@media (max-width:1100px){.fse-statusbar .sb-lo{display:none!important}}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="data.js"></script></head><body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script><script type="text/babel" src="LiveScreen.jsx"></script><script type="text/babel" src="MapScreen.jsx"></script><script type="text/babel" src="RunsScreen.jsx"></script><script type="text/babel" src="ReportScreen.jsx"></script><script type="text/babel" src="ExperimentsScreen.jsx"></script><script type="text/babel" src="ConfigScreen.jsx"></script><script type="text/babel" src="CardsScreen.jsx"></script>
<script type="text/babel">
const LABEL={live:'live',map:'map',cards:'cards',runs:'runs',experiments:'experiments',config:'configs'};
function App(){const [page,setPage]=React.useState(()=>localStorage.getItem('fse-page')||'live');const [run,setRun]=React.useState(null);const [theme,setTheme]=React.useState('dark');
React.useEffect(()=>{localStorage.setItem('fse-page',page)},[page]);
React.useEffect(()=>{document.documentElement.setAttribute('data-theme',theme)},[theme]);
const go=p=>{setRun(null);setPage(p)};
const crumbs=[{label:'fse',onClick:()=>go('live')},{label:LABEL[page],onClick:()=>go(page)}].concat(run?[{label:run}]:page==='config'?[{label:'playbook_baseline.yaml'}]:[]);
let body;if(page==='runs'&&run)body=<ReportScreen id={run} back={()=>setRun(null)}/>;else body={live:<LiveScreen/>,map:<MapScreen/>,cards:<CardsScreen/>,runs:<RunsScreen openRun={setRun}/>,experiments:<ExperimentsScreen/>,config:<ConfigScreen/>}[page];
return <Shell page={page} setPage={go} crumbs={crumbs} theme={theme} setTheme={setTheme}>{body}</Shell>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
