<!-- @dsCard group="Colors" viewport="700x170" name="Light theme" subtitle="data-theme="light" — same roles, darkened for contrast" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page);color:var(--text-primary)}.m{font:var(--fw-regular) var(--fs-11)/1.3 var(--font-mono);color:var(--text-tertiary)}.v{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-mono);color:var(--text-secondary)}</style></head><body><div data-theme="light" style="background:var(--ink-0);padding:16px;border-radius:6px;display:flex;gap:10px;flex-direction:column"><div style="display:flex;gap:8px"><div style="flex:1;height:44px;border-radius:4px;background:var(--ink-0);border:1px solid var(--line-1)"></div><div style="flex:1;height:44px;border-radius:4px;background:var(--ink-2);border:1px solid var(--line-1)"></div><div style="flex:1;height:44px;border-radius:4px;background:var(--ink-4);border:1px solid var(--line-1)"></div><div style="flex:1;height:44px;border-radius:4px;background:var(--line-2);border:1px solid var(--line-1)"></div><div style="flex:1;height:44px;border-radius:4px;background:var(--fg-3);border:1px solid var(--line-1)"></div><div style="flex:1;height:44px;border-radius:4px;background:var(--fg-1);border:1px solid var(--line-1)"></div><div style="flex:1;height:44px;border-radius:4px;background:var(--color-ice);border:1px solid var(--line-1)"></div><div style="flex:1;height:44px;border-radius:4px;background:var(--color-bull);border:1px solid var(--line-1)"></div><div style="flex:1;height:44px;border-radius:4px;background:var(--color-bear);border:1px solid var(--line-1)"></div><div style="flex:1;height:44px;border-radius:4px;background:var(--color-warning);border:1px solid var(--line-1)"></div></div><span style="font:var(--type-small);color:var(--fg-2)">Ice darkens to <b style="color:var(--color-ice)">#2f74d0</b>; bull/bear/warning step down for 4.5:1 on white.</span></div></body></html>
