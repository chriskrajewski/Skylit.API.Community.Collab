<!-- @dsCard group="Spacing" viewport="700x170" name="Borders & elevation" subtitle="Hairlines do the work; shadows only for overlays" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page);color:var(--text-primary)}.m{font:var(--fw-regular) var(--fs-11)/1.3 var(--font-mono);color:var(--text-tertiary)}.v{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-mono);color:var(--text-secondary)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;background:var(--ink-0);padding:8px"><div style="background:var(--ink-1);border:1px solid var(--line-1);border-radius:6px;padding:14px;height:88px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:var(--type-h3)">Flat panel</span><span class="m">border: line-1 · no shadow</span></div><div style="background:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:14px;height:88px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:var(--type-h3)">Raised control</span><span class="m">border: line-2</span></div><div style="background:var(--ink-2);box-shadow:var(--shadow-overlay);border-radius:6px;padding:14px;height:88px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:var(--type-h3)">Overlay</span><span class="m">--shadow-overlay</span></div></div></body></html>
