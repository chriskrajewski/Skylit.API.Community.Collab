<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="2 → 64px; 4/8 rhythm with 6 and 12 steps" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page);color:var(--text-primary)}.m{font:var(--fw-regular) var(--fs-11)/1.3 var(--font-mono);color:var(--text-tertiary)}.v{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-mono);color:var(--text-secondary)}</style></head><body><div style="display:flex;align-items:flex-end;gap:14px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:2px;height:2px;background:var(--color-ice-wash-2);border:1px solid var(--color-ice-deep)"></div><span class="m">sp-1<br>2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:4px;height:4px;background:var(--color-ice-wash-2);border:1px solid var(--color-ice-deep)"></div><span class="m">sp-2<br>4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:6px;height:6px;background:var(--color-ice-wash-2);border:1px solid var(--color-ice-deep)"></div><span class="m">sp-3<br>6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:8px;height:8px;background:var(--color-ice-wash-2);border:1px solid var(--color-ice-deep)"></div><span class="m">sp-4<br>8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:12px;height:12px;background:var(--color-ice-wash-2);border:1px solid var(--color-ice-deep)"></div><span class="m">sp-5<br>12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:16px;height:16px;background:var(--color-ice-wash-2);border:1px solid var(--color-ice-deep)"></div><span class="m">sp-6<br>16</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:20px;height:20px;background:var(--color-ice-wash-2);border:1px solid var(--color-ice-deep)"></div><span class="m">sp-7<br>20</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:24px;background:var(--color-ice-wash-2);border:1px solid var(--color-ice-deep)"></div><span class="m">sp-8<br>24</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:32px;height:32px;background:var(--color-ice-wash-2);border:1px solid var(--color-ice-deep)"></div><span class="m">sp-9<br>32</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:48px;height:48px;background:var(--color-ice-wash-2);border:1px solid var(--color-ice-deep)"></div><span class="m">sp-10<br>48</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--color-ice-wash-2);border:1px solid var(--color-ice-deep)"></div><span class="m">sp-11<br>64</span></div></div></body></html>
