<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page);color:var(--text-primary)}.m{font:var(--fw-regular) var(--fs-11)/1.3 var(--font-mono);color:var(--text-tertiary)}.v{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-mono);color:var(--text-secondary)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px"><div style="display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--ink-1)"><div style="height:56px;background:var(--color-bull)"></div><div style="padding:8px 10px;display:flex;flex-direction:column;gap:4px"><span class="v" style="color:var(--fg-1)">Bull</span><span class="m">#34d399<br>--color-bull</span></div></div><div style="display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--ink-1)"><div style="height:56px;background:var(--color-bear)"></div><div style="padding:8px 10px;display:flex;flex-direction:column;gap:4px"><span class="v" style="color:var(--fg-1)">Bear / Error</span><span class="m">#f87171<br>--color-bear</span></div></div><div style="display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--ink-1)"><div style="height:56px;background:var(--color-warning)"></div><div style="padding:8px 10px;display:flex;flex-direction:column;gap:4px"><span class="v" style="color:var(--fg-1)">Warning</span><span class="m">#fbbf24<br>--color-warning</span></div></div><div style="display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--ink-1)"><div style="height:56px;background:var(--color-info)"></div><div style="padding:8px 10px;display:flex;flex-direction:column;gap:4px"><span class="v" style="color:var(--fg-1)">Info</span><span class="m">#90bff9<br>--color-info</span></div></div></div></body></html>
