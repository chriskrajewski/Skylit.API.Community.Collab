<!-- @dsCard group="Spacing" viewport="700x160" name="Motion" subtitle="80–280ms, ease-out, no bounce" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page);color:var(--text-primary)}.m{font:var(--fw-regular) var(--fs-11)/1.3 var(--font-mono);color:var(--text-tertiary)}.v{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-mono);color:var(--text-secondary)}.b{width:28px;height:28px;border-radius:4px;background:var(--color-ice)}@keyframes s{0%,15%{transform:translateX(0)}55%,100%{transform:translateX(220px)}}</style></head><body><div style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:16px"><span class="v" style="width:120px">--dur-instant 80ms</span><div style="flex:1;height:1px;background:var(--line-1);position:relative"><div class="b" style="position:absolute;top:-6px;width:12px;height:12px;animation:s 640ms var(--ease-out) infinite alternate"></div></div></div><div style="display:flex;align-items:center;gap:16px"><span class="v" style="width:120px">--dur-fast 120ms</span><div style="flex:1;height:1px;background:var(--line-1);position:relative"><div class="b" style="position:absolute;top:-6px;width:12px;height:12px;animation:s 960ms var(--ease-out) infinite alternate"></div></div></div><div style="display:flex;align-items:center;gap:16px"><span class="v" style="width:120px">--dur-base 180ms</span><div style="flex:1;height:1px;background:var(--line-1);position:relative"><div class="b" style="position:absolute;top:-6px;width:12px;height:12px;animation:s 1440ms var(--ease-out) infinite alternate"></div></div></div><div style="display:flex;align-items:center;gap:16px"><span class="v" style="width:120px">--dur-slow 280ms</span><div style="flex:1;height:1px;background:var(--line-1);position:relative"><div class="b" style="position:absolute;top:-6px;width:12px;height:12px;animation:s 2240ms var(--ease-out) infinite alternate"></div></div></div><span class="m">Hover/color changes = fast. Overlays rise 6px + fade = base. Only the live dot loops.</span></div></body></html>
