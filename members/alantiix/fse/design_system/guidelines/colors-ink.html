<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-page);color:var(--text-primary)}.m{font:var(--fw-regular) var(--fs-11)/1.3 var(--font-mono);color:var(--text-tertiary)}.v{font:var(--fw-medium) var(--fs-11)/1.3 var(--font-mono);color:var(--text-secondary)}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px"><div style="display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--ink-1)"><div style="height:56px;background:var(--color-white)"></div><div style="padding:8px 10px;display:flex;flex-direction:column;gap:4px"><span class="v" style="color:var(--fg-1)">White</span><span class="m">#ffffff<br>--color-white</span></div></div><div style="display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--ink-1)"><div style="height:56px;background:var(--color-mist)"></div><div style="padding:8px 10px;display:flex;flex-direction:column;gap:4px"><span class="v" style="color:var(--fg-1)">Mist · fg</span><span class="m">#e8e8e8<br>--color-mist</span></div></div><div style="display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--ink-1)"><div style="height:56px;background:var(--color-fog)"></div><div style="padding:8px 10px;display:flex;flex-direction:column;gap:4px"><span class="v" style="color:var(--fg-1)">Fog · muted</span><span class="m">#9ca3af<br>--color-fog</span></div></div><div style="display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--ink-1)"><div style="height:56px;background:var(--color-graphite-2)"></div><div style="padding:8px 10px;display:flex;flex-direction:column;gap:4px"><span class="v" style="color:var(--fg-1)">Graphite 2</span><span class="m">#151515<br>--color-graphite-2</span></div></div><div style="display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--ink-1)"><div style="height:56px;background:var(--color-ink)"></div><div style="padding:8px 10px;display:flex;flex-direction:column;gap:4px"><span class="v" style="color:var(--fg-1)">Ink · bg</span><span class="m">#0a0a0a<br>--color-ink</span></div></div><div style="display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--ink-1)"><div style="height:56px;background:var(--color-black)"></div><div style="padding:8px 10px;display:flex;flex-direction:column;gap:4px"><span class="v" style="color:var(--fg-1)">Black</span><span class="m">#000000<br>--color-black</span></div></div></div></body></html>
