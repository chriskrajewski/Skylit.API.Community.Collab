# fse-runner.service drop-in for the console (modules/ui_host).
# ExecStartPre appends after Phase 1's (docker rm, fetch-secrets): the mode
# and config come from /fse/runner_mode and /fse/runner_config, and the
# plugin-orders switch from /fse/control/plugin_orders (/run/fse-control).
# The empty ExecStart= resets Phase 1's fse-start.sh: fse-console-start.sh is
# the same docker run plus the read-only /run/fse-control mount.
# The empty ExecStopPost= resets Phase 1's list so the state write runs before
# fse-alert.sh (no - prefix: a failed publish would skip later commands).
# The cache sync also runs every 30 minutes (fse-cache-sync.timer).
# Deleting this file restores Phase 1's behavior (no mount: plugin orders off).
[Service]
ExecStartPre=/usr/local/bin/fse-runner-mode.sh
# Bars from S3 (a failed sync never blocks the runner: it starts on what is on disk).
ExecStartPre=-/usr/local/bin/fse-sync-cache.sh
ExecStart=
ExecStart=/usr/local/bin/fse-console-start.sh
ExecStartPost=-/usr/local/bin/fse-runner-state.sh started
ExecStopPost=
ExecStopPost=-/usr/local/bin/fse-runner-state.sh stopped
ExecStopPost=/usr/local/bin/fse-alert.sh
