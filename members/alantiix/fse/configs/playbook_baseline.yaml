# Playbook_Baseline (Req 17.9): a starting Strategy_Config made of the Config_Schema
# defaults (src/fse/config/schema/), generated with fse.config.printer. It takes no
# position on whether any setting has edge. Tune it for your own research.
#
# - Paper Order_Mode: the in-process Paper_Broker; no broker order is ever sent.
# - Every key is written out, even where it equals the schema default.
# - "OPERATOR: required" marks a value the schema leaves without a default. The
#   Config_Loader rejects this file until the Operator enters it.
# - Never put an account name, account id or credential in this file (Req 17.5).

schema_version: 1
config_id: playbook_baseline
order_mode: paper
time:
  decision_cadence_s: 60
  timezone: America/New_York
data:
  symbols:
  - SPX
  - SPY
  - QQQ
  - NDX
  - NDXP
  heatmap_view:
    max_strikes: 92
    max_expirations: 5
    expirations: null
    include_empty: false
  regime_symbol: SPX
  es_source_symbol: SPX
  nq_source_symbol: QQQ
  nq_sources:
  - QQQ
  - NDX
  - NDXP
  instruments:
    es_levels: MES
    nq_levels: MNQ
  velocity_window_s: 60
nodes:
  node_fraction: 0.2
  gatekeeper_fraction: 0.3
  air_pocket_min_width_pct: 0.5
  lookout_pct: 1.0
  decay_fraction: 0.2
  dormant_distance_pct: 3.5
  sloppy_seconds:
    window_min: 15
    fraction: 0.1
  clustering:
    enabled: false
    es_width_pts: 5.0
# OPERATOR: required: regime.min_abs_value (Req 7.4, no default). Calibrate it from your own
# data, e.g. `fse calibrate regime-min-abs --start <date> --end <date> --percentile <p>`,
# and add it under `regime:` below.
regime:
  regime_distance_pct: 1.0
  vanna_multiple: 2.0
  whipsaw_pct: 15.0
  vix_condition:
    enabled: true
    pct: 5.0
    intraday_source: false
  grade:
    major_fraction: 0.5
    floor_ceiling_ratio: 1.5
levels:
  methods:
    SPY: ratio
    NDX: ratio
    NDXP: ratio
  es_half_width_pts: 5.0
  qqq_half_width_usd: 0.5
  max_price_gap_s: 120
chart:
  pivot_len:
    '60': 3
    '240': 3
  swings_kept: 5
  bos_pivot_len:
    '1': 3
    '5': 3
  sweep_ticks: 2
  candle_timeframe_s: 60
  sweep_timeframe_s: 60
patterns:
  gatekeeper_fade:
    enabled: true
    metric: gamma
    entry_offset_ticks: 0
    stop_rule: null
    fixed_stop_ticks: 8
    invalidation: level
    stop_lookout_pct: 1.0
    arming:
      es_pts: 10.0
      nq_qqq_usd: 1.0
  floor_ceiling_bounce:
    enabled: true
    metric: gamma
    entry_offset_ticks: 0
    stop_rule: null
    fixed_stop_ticks: 8
    invalidation: level
    stop_lookout_pct: 1.0
    arming:
      es_pts: 10.0
      nq_qqq_usd: 1.0
  floor_ceiling_bounce_empty_basement:
    enabled: true
    metric: gamma
    entry_offset_ticks: 0
    stop_rule: null
    fixed_stop_ticks: 8
    invalidation: level
    stop_lookout_pct: 1.0
    arming:
      es_pts: 10.0
      nq_qqq_usd: 1.0
  beach_ball:
    enabled: true
    metric: gamma
    entry_offset_ticks: 0
    stop_rule: null
    fixed_stop_ticks: 8
    invalidation: level
    stop_lookout_pct: 1.0
    arming:
      es_pts: 10.0
      nq_qqq_usd: 1.0
    major_fraction: 0.5
  rug:
    enabled: true
    metric: gamma
    entry_offset_ticks: 0
    stop_rule: null
    fixed_stop_ticks: 8
    invalidation: level
    stop_lookout_pct: 1.0
    arming:
      es_pts: 10.0
      nq_qqq_usd: 1.0
    stack_pct: 0.5
  reverse_rug:
    enabled: true
    metric: gamma
    entry_offset_ticks: 0
    stop_rule: null
    fixed_stop_ticks: 8
    invalidation: level
    stop_lookout_pct: 1.0
    arming:
      es_pts: 10.0
      nq_qqq_usd: 1.0
    stack_pct: 0.5
  whipsaw_fade:
    enabled: true
    metric: gamma
    entry_offset_ticks: 0
    stop_rule: null
    fixed_stop_ticks: 8
    invalidation: level
    stop_lookout_pct: 1.0
    arming:
      es_pts: 10.0
      nq_qqq_usd: 1.0
  trend_follow:
    enabled: true
    metric: gamma
    entry_offset_ticks: 0
    stop_rule: null
    fixed_stop_ticks: 8
    invalidation: level
    stop_lookout_pct: 1.0
    arming:
      es_pts: 10.0
      nq_qqq_usd: 1.0
    trend_min_pct: 1.0
