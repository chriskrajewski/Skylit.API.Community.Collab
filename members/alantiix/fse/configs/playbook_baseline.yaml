      far: -2.5
    - near: -3.5
      far: -4.5
  dark_pool_confluence:
    enabled: false
    min_notional_usd: 1000000.0
    lookback_sessions: 5
    es_ticker: SPY
    nq_ticker: QQQ
  trinity_agreement:
