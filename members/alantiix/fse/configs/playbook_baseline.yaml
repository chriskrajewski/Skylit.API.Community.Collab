  - candle_color
  - tap_count
  - third_gatekeeper_test
  - weekly_node_tests
  - sloppy_seconds
  - air_pocket_fade
  - min_reward_risk
  - opposition_inside_target
  - fomo_travel
  - open_shuffle
  - entry_cutoff
  - late_session_chase
  - news_window
  - vix_gap
  - regime_match
  - dormant_node
  - gatekeepers_on_path
  - node_growth_divergence
  - kill_switch_lockout
  fade_detectors:
  - gatekeeper_fade
  - floor_ceiling_bounce
  - floor_ceiling_bounce_empty_basement
  - beach_ball
  - whipsaw_fade
  stale_map:
    enabled: true
