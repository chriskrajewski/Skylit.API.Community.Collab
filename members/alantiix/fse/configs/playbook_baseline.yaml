      mode: next_node
      stop_rule: one_node_beyond
    Negative_Gamma: null
    Vanna_Dominant: null
    Whipsaw: null
    Structureless: null
  modes:
    fixed_r:
      enabled: true
      r_multiple: 3.0
    next_node:
      enabled: true
    tp1_partial_be:
      enabled: false
      tp1:
