      - Positive_Gamma
      - Whipsaw
      floor_ceiling_bounce:
      - Positive_Gamma
      - Whipsaw
      floor_ceiling_bounce_empty_basement:
      - Positive_Gamma
      - Whipsaw
      beach_ball:
