      reverse_rug:
      - Positive_Gamma
      - Negative_Gamma
      whipsaw_fade:
      - Whipsaw
      trend_follow:
      - Negative_Gamma
      - Vanna_Dominant
  dormant_node:
    enabled: true
  gatekeepers_on_path:
    enabled: true
    fail_at: 2
  node_growth_divergence:
    enabled: true
    fail_at_pct: 20.0
  kill_switch_lockout:
    enabled: true
exits:
  global:
    mode: opposition_or_fixed_r
    stop_rule: one_node_beyond
  per_regime:
