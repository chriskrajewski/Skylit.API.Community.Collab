early_closes:
  # 2023
  - {date: 2023-07-03, time: "13:15", name: Day before Independence Day}
  - {date: 2023-11-24, time: "13:15", name: Day after Thanksgiving}
  # 2024
  - {date: 2024-07-03, time: "13:15", name: Day before Independence Day}
  - {date: 2024-11-29, time: "13:15", name: Day after Thanksgiving}
  - {date: 2024-12-24, time: "13:15", name: Christmas Eve}
  # 2025
  - {date: 2025-07-03, time: "13:15", name: Day before Independence Day}
  - {date: 2025-11-28, time: "13:15", name: Day after Thanksgiving}
  - {date: 2025-12-24, time: "13:15", name: Christmas Eve}
