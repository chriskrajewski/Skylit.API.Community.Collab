# OPERATOR: PLEASE VERIFY THIS FILE before you rely on any backtest or live run.
# Check the roll dates against the sources below and against the contract your
# bar source and broker actually serve. Before each quarter, add the next
# contract and move `covers.last`.
#
# Futures roll calendar (Req 4.5), read by `fse.calendars`. A missing file, an
# invalid entry, or a run session outside `covers` stops the run before the
# first Decision_Time with exit code 2 (Req 4.16).
#
# Sources (checked 2026-10-03):
#   CME Group equity index roll dates:
#     https://www.cmegroup.com/trading/equity-index/rolldates.html
#   CME Group E-mini S&P 500 and E-mini Nasdaq-100 contract specs (quarterly
#   March, June, September and December contracts):
#     https://www.cmegroup.com/markets/equities/sp/e-mini-sandp500.contractSpecs.html
#     https://www.cmegroup.com/markets/equities/nasdaq/e-mini-nasdaq-100.contractSpecs.html
#
# Conventions:
#   - Each entry assigns one contract to every session from `first` to `last`,
#     both inclusive. Every bar of a session, including the bars from 18:00 the
#     evening before, comes from that contract (Req 4.5). A session with no
#     entry has no contract; the coverage report records it (Req 4.8).
#   - Roll rule: CME's published equity roll date, the Monday before the third
#     Friday of the expiration month. From that session on, the next quarterly
#     contract is used. The 2026 dates (03-16, 06-15, 09-14, 12-14) match CME's
#     page as quoted by other sites; cmegroup.com refused automated downloads.
#     The same rule is applied to 2023-2025. Some platforms roll on the
#     Thursday eight days before expiration instead; compare with your data.
#   - June 2026: the third Friday (2026-06-19) is the Juneteenth holiday; the
#     roll date is still Monday 2026-06-15.
#   - Roll dates from 2024-03 on follow the Atlas continuous-symbol switch
#     (detected 2026-10-05 from 60-minute and 1-minute Atlas bars), not the
#     CME roll date. This overrides the roll rule above and the "not on the
#     dates below" note under atlas_symbol. The 2023 entries keep the CME
#     dates (Atlas has no bars before the 2024-01-02 session).
#     Observed rule: each symbol switches at 00:00 UTC (20:00 ET in daylight
#     time, 19:00 ET in standard time) on the Tuesday or the Wednesday of the
#     expiry week, never during RTH. The new contract starts with the next
#     session, the first whose RTH is entirely on the new contract; the old
#     contract ends the session before. ES1 and MES1 switched on Tuesday in all
#     11 quarters. NQ1 and MNQ1 switched on Wednesday in some quarters, and
#     not always together.
#     Projected: the 2026-12 roll has no data yet. It assumes a Tuesday
#     2026-12-15 switch for ES, MES and NQ (new contract from 2026-12-16) and
#     a Wednesday 2026-12-16 switch for MNQ (from 2026-12-17). Check these
#     entries against Atlas bars after the roll. The projected 2026-12 mixed
#     sessions carry a `note`.
#     Mixed sessions: the bars from 18:00 the evening before up to the switch
#     come from the old contract, so the session holds a price jump of about
#     50-75 points (ES, MES) or 200-320 points (NQ, MNQ). Every such session
#     is listed under `mixed_sessions:` at the end of this file (switch = New
#     York time, the evening before the session). The Backtester and every
#     experiment skip them and record the skip as `mixed_roll_session`.
#     June 2024 has no mixed session: the switch was 2024-06-18 20:00 ET, the
#     2024-06-19 Juneteenth holiday is not a session, and the 2024-06-20
#     session (from 18:00 on 06-19) is all new contract.
#     Live trading: the ProjectX front month may switch earlier than these
#     dates, so the Live_Runner contract check (Req 24.11-24.12) can block an
#     instrument for a few days per quarter. The Operator accepted this.
#   - Contract codes use CME Globex single-digit years: ESZ6 is December 2026.
#   - atlas_symbol: Atlas serves no per-contract tickers (a search for a
#     contract code such as MESZ6 matched nothing). It serves the continuous front-month symbols ES1,
#     NQ1, MES1 and MNQ1 (type futures, exchange CME), confirmed with Atlas
#     GET /v1/search and GET /v1/history on 2026-10-05, so every entry names
#     its instrument's continuous symbol. The continuous symbol rolls on its
#     own schedule, not on the dates below: MNQ1 still served MNQU6 on the
#     2026-09-14 to 2026-09-16 sessions and switched to MNQZ6 around 20:00 ET on
#     2026-09-16. Intraday Atlas bars start with the 2024-01-02 session.
#   - projectx_contract_id is optional; add it once resolved with the ProjectX
#     contract search, for example:
#       - {first: 2026-12-14, last: 2026-12-31, contract: ESH7,
#          atlas_symbol: ES1, projectx_contract_id: <ProjectX id>}
#     The Live_Runner compares the ProjectX front-month id with this file at
#     each session start and blocks the instrument on a mismatch (Req 24.11-24.12).
#   - Dates are YYYY-MM-DD.

