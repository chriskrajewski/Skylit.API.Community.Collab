# OPERATOR: PLEASE VERIFY THIS FILE before you rely on any backtest or live run.
# Check every date and time below against the sources listed here. BLS and the
# Federal Reserve sometimes move releases (for example during a government
# shutdown), so re-check upcoming dates before each live week. When a new
# schedule is published, add its entries and move `covers.last`.
#
# Scheduled economic releases (Req 4.14), read by `fse.calendars` and used by
# the news_window Gate. A missing file, an invalid entry, or a run session
# outside `covers` stops the run before the first Decision_Time with exit
# code 2 (Req 4.16).
#
# Sources (checked 2026-10-03):
#   BLS CPI release schedule:
#     https://www.bls.gov/schedule/news_release/cpi.htm
#   BLS Employment Situation (NFP) release schedule:
#     https://www.bls.gov/schedule/news_release/empsit.htm
#     https://www.bls.gov/cps/publications/release-calendar.htm
#   BLS revised release dates after the 2025 and 2026 lapses in appropriations:
#     https://www.bls.gov/bls/2025-lapse-revised-release-dates.htm
#   BLS archived releases (each one states its release date):
#     https://www.bls.gov/bls/news-release/cpi.htm
#     https://www.bls.gov/bls/news-release/empsit.htm
#   Federal Reserve FOMC meeting calendars:
#     https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#   FOMC policy statement time (2:00 p.m. Eastern on the meeting's last day):
#     https://www.federalreserve.gov/newsevents/pressreleases/monetary20240809a.htm
#
# Notes:
#   - CPI and NFP are released at 08:30. FOMC entries are the 14:00 policy
#     statement of each regularly scheduled meeting (minutes are not listed).
#     The 2025-08-22 notation vote had no scheduled statement and is left out.
#   - 2025 shutdown: September 2025 CPI moved to 2025-10-24; October 2025 CPI
#     was cancelled; November 2025 CPI moved to 2025-12-18. The September 2025
#     jobs report moved to 2025-11-20; October 2025 had no report of its own
#     and its payroll data came out with November on 2025-12-16.
#   - 2026 lapse: the January 2026 jobs report moved from 2026-02-06 to
#     2026-02-11, and January 2026 CPI from 2026-02-11 to 2026-02-13.
#   - The bls.gov schedule pages refused automated downloads, so dates were
#     checked through BLS search listings and archived releases. 2026-11-10
#     (October 2026 CPI) was confirmed only from a copy of the BLS schedule
#     at https://www.usinflationcalculator.com/inflation/consumer-price-index-release-schedule/
#   - Releases on non-session dates (Good Friday 2023-04-07 and 2026-04-03)
#     are listed; they affect no Decision_Time.
#
# Format: one entry per release.
#   type: CPI, NFP, FOMC, or an Operator-added type in capital letters, digits
#         or underscores (for example PPI or RETAIL_SALES)
#   date: YYYY-MM-DD release date
#   time: "HH:MM" America/New_York release time, 24-hour, quoted
#   note: optional free text

