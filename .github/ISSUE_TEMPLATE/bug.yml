name: Bug in a project
description: Report a problem in a project already shared in this repository.
title: "bug: "
labels:
  - bug
body:
  - type: input
    id: discord
    attributes:
      label: Discord username
      description: Discord username of the member who shared the project. This is the member folder name.
      placeholder: alice
    validations:
      required: true
  - type: input
    id: project-id
    attributes:
      label: Project identifier
      description: Project folder name under that member.
      placeholder: flow-sweep-agent
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you saw. Leave out API keys and other secrets.
    validations:
      required: true
